name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v6

    - name: Check out Yggdrasil
      uses: actions/checkout@v6
      with:
        repository: lespromtehkms/yggdrasil-go
        path: yggdrasil-go
        ref: develop
        fetch-depth: 0
    
    - name: Setup Go environment
      uses: actions/setup-go@v6
      with:
        go-version: stable
    
    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        ~/go/bin/gomobile init
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Install NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r21e
        add-to-path: false
      
    - name: Build Yggdrasil
      run: |
        mkdir -p app/libs
        cd yggdrasil-go
        PATH=$PATH:~/go/bin/ ./contrib/mobile/build -a
        cp {yggdrasil.aar,yggdrasil-sources.jar} ../app/libs
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

    - name: Gradle signed build
      run: |
        rm -f app/gha.jks
        keytool -genkeypair -v \
          -keystore app/gha.jks \
          -alias yggdrasil-android \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass g1thub4ct10n34yggdr4s1l4ndr01d \
          -keypass g1thub4ct10n34yggdr4s1l4ndr01d \
          -dname "CN=lespromtehkms, OU=Yggdrasil, O=Yggdrasil, L=City, S=State, C=RU"
        chmod +x gradlew
        ./gradlew assembleYggdrasil

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: yggdrasil-android
        path: app/build/outputs/apk/yggdrasil/app-yggdrasil.apk
